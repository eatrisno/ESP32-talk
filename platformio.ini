; ESP32-S3 mesh walkie-talkie. ESP-IDF (no Arduino): the USB audio and HID host drivers
; come from the Espressif component registry, see src/idf_component.yml.
;
;   pio run -e esp32s3 -t upload -t monitor     build, flash, open the console
;   pio test -e native                          host tests, no hardware needed

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags = -std=gnu++17
; lib/wt_core is compiled by src/CMakeLists.txt; stop PlatformIO building it a second time
lib_ignore = wt_core

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -O2 -Wall -Wextra
lib_compat_mode = off
