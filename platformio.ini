; PlatformIO Project Configuration File for ESP32-S3 HT Full Duplex Mesh Walkie-Talkie

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.arduino.usb_mode = 0
board_build.arduino.usb_cdc_on_boot = 0
lib_deps = 
	esp-arduino-libs/ESP32_USB_STREAM@^0.1.0
build_flags = 
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ESP_WIFI_ENABLE_WIFI_TX_STATS=0
	-DCONFIG_UVC_GET_CONFIG_DESC=1
	-DCONFIG_UVC_GET_DEVICE_DESC=1
	-DCONFIG_UVC_PRINT_DESC=1
	-DCONFIG_USB_PRE_ALLOC_CTRL_TRANSFER_URB=1
	-DCONFIG_CTRL_TRANSFER_DATA_MAX_BYTES=4096
monitor_filters = esp32_exception_decoder
